# dsh-crash-recovery bundle patch: insert the Host plugin into the profile layer stack.
# 2026-11-19: a sweep resumed 20 fanout-worker sessions at once and the Host hit its
# 4 GiB V8 heap limit ~4 minutes after each boot (three OOM exits: 22:33 / 22:37 / 22:42).
# The sweep is now bounded, paced, cooldown-aware and memory-guarded. Do not raise
# maxSessionsPerSweep back to a large number without measuring the Host heap.
- insert:
    - id: crash-recovery
      name: 'dsh-crash-recovery'
      config:
        enabled: true
        heartbeatMs: 15000
        supervise: true
        superviseAlways: false
        resumeOnRecovery: true
        resumeDelayMs: 8000
        supervisorTimeoutMs: 900000
        verifyDelayMs: 4000
        includeSubagents: false
        maxSessionsPerSweep: 3
        resumeGapMs: 8000
        resumeCooldownMs: 1800000
        resumeMemoryGuardRatio: 0.75
        maxRunAgeMs: 43200000
        maxJournalAgeMs: 604800000
        injectPrompt: true
