# dsh-fanout bundle patch: insert the Host plugin row and the checkout service
# it owns into the profile layer stack.
#
# `isolate` is load-bearing, not tuning. The bundled forge panel decides whether
# to draw its own worktree option from `ctx.get('worktrees')`; mounting the
# service in the root realm would bring that second control back. Keeping the
# provider and its consumer in one named realm leaves forge's change-request
# panel (which needs no checkout service) untouched while fan-out becomes the
# only surface that creates a worktree.
- insert:
    - id: fanout
      name: 'dsh-fanout'
      config: {}
      isolate:
        worktrees: fanout
    - id: fanout-worktree
      name: '@deepseek-ai/dsh-experimental-worktree'
      isolate:
        worktrees: fanout
    - id: fanout-tool-worktree
      name: '@deepseek-ai/dsh-experimental-tool-worktree'
      isolate:
        worktrees: fanout
