# dsh-session-bus-control bundle patch.
- insert:
    - id: session-bus-control
      name: 'dsh-session-bus-control'
      config:
        enabled: true
        excludeSessionIds:
          - session-79b85185-e140-4425-b9ca-e65f6e449270
        resumeDelayMs: 60000
        resumePrompt: >-
          （dsh-session-bus）一斉停止が解除されました。停止前に進めていた作業を再開してください。
          まず session_bus_digest で他セッションの進捗を確認し、共有ファイルは現物を読み直してから続行してください。
          再開内容を 1〜2 行で share_progress に記録してください。
