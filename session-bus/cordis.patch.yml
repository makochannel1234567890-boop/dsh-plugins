# dsh-session-bus bundle patch: insert the Host plugin into the profile layer stack.
- insert:
    - id: session-bus
      name: 'dsh-session-bus'
      config:
        enabled: true
        injectPrompt: true
        digestMaxChars: 1400
        maxEntries: 8
        maxAgeMinutes: 480
        includeSubagents: false
        allowControl: true
        workingPersistIntervalMs: 15000
